<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris-Sync-Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --grid-color: #1a1a1a;
            --text-main: #fff;
            --t-cyan: #00FFFF;
            --t-purple: #800080;
            --t-yellow: #FFFF00;
            --t-orange: #FFA500;
            --t-blue: #0000FF;
            --t-green: #00FF00;
            --t-red: #FF003C;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(var(--grid-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-color) 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .block-3d {
            box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.6), inset 4px 4px 0 rgba(255, 255, 255, 0.2);
            border: 2px solid #000;
        }

        /* 登入大廳 */
        #login-screen {
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 4px solid var(--t-blue);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 255, 0.3);
            z-index: 100;
        }

        #login-screen h1 { color: var(--t-cyan); text-shadow: 2px 2px 0 var(--t-blue); line-height: 1.5; font-size: 20px; margin-top:0;}
        
        .login-input {
            background: #000; color: var(--t-yellow); font-family: inherit; padding: 15px; border: 2px solid #555;
            font-size: 12px; text-align: center; text-transform: uppercase; outline: none;
        }
        .login-input:focus { border-color: var(--t-cyan); }

        /* 遊戲大廳 */
        #game-screen {
            display: none;
            grid-template-columns: 280px 240px 350px;
            gap: 30px;
            width: 950px;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h2 { font-size: 12px; margin-top: 0; margin-bottom: 20px; color: var(--t-yellow); text-shadow: 1px 1px 0 #000; text-align: center; line-height: 1.5;}
        .room-tag { font-size: 12px; color: var(--t-cyan); text-align: center; margin-bottom: 20px; letter-spacing: 2px;}

        .timer-panel { background: #151515; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #222;}
        .time-input { background: #000; color: var(--t-green); font-family: inherit; font-size: 16px; text-align: center; width: 120px; padding: 15px; border: 2px solid #444; margin-bottom: 30px; outline:none;}
        .time-display { font-size: 42px; color: var(--text-main); margin-bottom: 40px; text-shadow: 4px 4px 0 #000; }
        
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;}
        .btn { font-family: inherit; font-size: 10px; color: #fff; padding: 15px 15px; cursor: pointer; text-transform: uppercase; outline:none; }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--t-green); }
        .btn-pause { background: var(--t-orange); }
        .btn-bgm { background: var(--t-purple); }
        .btn-leave { background: var(--t-red); margin-top: 20px; font-size: 10px; padding: 10px; width: 100%;}

        .canvas-panel { background: #111; padding: 20px; border: 2px solid #222; display: flex; flex-direction: column; align-items: center;}
        canvas { background: #000; border: 2px solid #444; box-shadow: 0 0 10px rgba(0,255,255,0.2); }

        .leaderboard-panel { background: #111; padding: 20px; border: 2px solid #222; overflow-y: auto; max-height: 450px;}
        .player-row { display: flex; flex-direction: column; margin-bottom: 25px; }
        .player-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        .score-bar-container { width: 100%; height: 25px; background: #000; border: 2px solid #333; padding: 2px; }
        .score-bar {
            height: 100%; width: 0%; transition: width 0.5s linear;
            background-image: linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px); background-size: 25px 25px;
        }
    </style>
</head>

    <!-- 登入畫面 -->
    <div id="login-screen" class="block-3d">
        <h1>TETRIS SYNC<br>ARENA</h1>
        <!-- 改為空白輸入框，讓使用者自行輸入 -->
        <input type="text" id="playerName" class="login-input" placeholder="YOUR NAME" maxlength="10">
        <input type="text" id="roomCode" class="login-input" placeholder="ROOM CODE" maxlength="15">
        <button class="btn btn-start block-3d" onclick="joinRoom()">JOIN ROOM</button>
        <p style="font-size: 8px; color: #666; line-height: 1.6;">
            * 跨分頁展示技術：<br>請在電腦上左右開啟兩個視窗<br>輸入相同房號即可看見即時同步效果！
        </p>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen">
        <div class="timer-panel block-3d">
            <h2>MY FOCUS</h2>
            <div class="room-tag" id="roomDisplay">ROOM: ----</div>
            <div style="font-size: 10px; color: #888; margin-bottom: 10px;">SET MINUTES</div>
            <input type="number" id="minutesInput" class="time-input" value="25" min="1" max="120">
            <div class="time-display" id="timeDisplay">25:00</div>
            
            <div class="btn-group">
                <button class="btn btn-start block-3d" id="startBtn" onclick="toggleTimer()">START</button>
                <button class="btn btn-pause block-3d" onclick="resetTimer()">RESET</button>
                <button class="btn btn-bgm block-3d" id="bgmBtn" onclick="toggleBGM()">🎵 BGM: OFF</button>
            </div>
            
            <button class="btn btn-leave block-3d" onclick="leaveRoom()">LEAVE ROOM</button>
        </div>

        <div class="canvas-panel block-3d">
            <h2>AI TETRIS</h2>
            <canvas id="tetrisCanvas" width="200" height="360"></canvas>
            <div id="aiLabel" style="font-size: 9px; color: var(--t-cyan); text-align: center; margin-top: 15px;">AI AUTO-STACKING</div>
        </div>

        <div class="leaderboard-panel block-3d">
            <h2>LIVE LEADERBOARD</h2>
            <div id="leaderboardContainer"></div>
        </div>
    </div>

    <script>
        const COLORS = ['#00FFFF', '#800080', '#FFFF00', '#FFA500', '#0000FF', '#00FF00', '#FF003C'];
        let myData = { name: '', score: 0, color: '' };
        let roomKey = '';

        // BGM 控制
        function toggleBGM() {
            let bgm = document.getElementById('bgmAudio');
            let btn = document.getElementById('bgmBtn');
            if (bgm.paused) {
                bgm.play().catch(e => alert("請先隨便點擊網頁其他地方，再開啟音樂！"));
                btn.innerText = '🎵 BGM: ON';
                btn.style.background = 'var(--t-cyan)';
                btn.style.color = '#000';
            } else {
                bgm.pause();
                btn.innerText = '🎵 BGM: OFF';
                btn.style.background = 'var(--t-purple)';
                btn.style.color = '#fff';
            }
        }

        // 加入房間
        function joinRoom() {
            let nameInput = document.getElementById('playerName').value.trim().toUpperCase();
            let roomInput = document.getElementById('roomCode').value.trim().toUpperCase();
            
            if (!nameInput || !roomInput) return alert("Please enter both Name and Room Code!");

            roomKey = `tetris_arena_${roomInput}`;
            
            // 讀取該房間的資料
            let roomData = {};
            try { roomData = JSON.parse(localStorage.getItem(roomKey)) || {}; } catch(e) {}
            
            // 如果自己以前有紀錄，繼承分數；否則建立新資料
            myData.name = nameInput;
            myData.score = roomData[nameInput] ? roomData[nameInput].score : 0;
            myData.color = roomData[nameInput] ? roomData[nameInput].color : COLORS[Math.floor(Math.random() * COLORS.length)];
            
            // 寫入並渲染
            syncToRoom();
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'grid';
            document.getElementById('roomDisplay').innerText = `ROOM: ${roomInput}`;
        }

        // 同步自己的資料到房間
        function syncToRoom() {
            try {
                let roomData = JSON.parse(localStorage.getItem(roomKey)) || {};
                roomData[myData.name] = myData;
                localStorage.setItem(roomKey, JSON.stringify(roomData));
                renderLeaderboard(roomData);
            } catch(e) {}
        }

        // 監聽「其他視窗/分頁」的資料變動 (真正的跨視窗連線核心)
        window.addEventListener('storage', (e) => {
            if (e.key === roomKey) {
                let roomData = JSON.parse(e.newValue) || {};
                // 如果別的視窗更新了排行榜，立刻重新渲染
                renderLeaderboard(roomData);
            }
        });

        // 渲染排行榜
        function renderLeaderboard(roomData) {
            const container = document.getElementById('leaderboardContainer');
            container.innerHTML = '';

            let playersArray = Object.values(roomData);
            playersArray.sort((a, b) => b.score - a.score); // 降冪排序

            let maxScore = Math.max(playersArray.length > 0 ? playersArray[0].score : 60, 60);

            playersArray.forEach((player, index) => {
                let isMe = player.name === myData.name;
                let medal = index === 0 && player.score > 0 ? '👑 ' : `${index + 1}.`;
                let nameHtml = isMe ? `<span style="color:${player.color}; text-shadow: 0 0 5px ${player.color};">${player.name} (YOU)</span>` : `<span style="color:${player.color}">${player.name}</span>`;
                
                let barWidth = (player.score / maxScore) * 100;
                if (barWidth > 100) barWidth = 100;

                let displayScore = player.score.toFixed(1);

                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="player-info">
                        <div class="player-name"><span style="color:#FFFF00">${medal}</span> ${nameHtml}</div>
                        <div>${displayScore} MINS</div>
                    </div>
                    <div class="score-bar-container">
                        <div class="score-bar block-3d" style="width: ${barWidth}%; background-color: ${player.color};"></div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // 計時器邏輯
        let timer;
        let isRunning = false;
        let timeLeft = 25 * 60;
        let dropCounter = 0;

        const display = document.getElementById('timeDisplay');
        const input = document.getElementById('minutesInput');
        const startBtn = document.getElementById('startBtn');

        input.addEventListener('change', () => {
            if(!isRunning) {
                timeLeft = (parseInt(input.value) || 1) * 60;
                updateDisplay();
            }
        });

        function updateDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.innerText = 'RESUME';
                startBtn.style.backgroundColor = 'var(--t-yellow)';
                startBtn.style.color = '#000';
                isRunning = false;
            } else {
                if (timeLeft === 0 || startBtn.innerText === 'START') {
                    timeLeft = (parseInt(input.value) || 1) * 60;
                }
                
                startBtn.innerText = 'PAUSE';
                startBtn.style.backgroundColor = 'var(--t-orange)';
                startBtn.style.color = '#fff';
                isRunning = true;
                
                if(!currentPiece) spawnPiece();

                timer = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    // 每秒鐘即時增加分數，並同步到 LocalStorage 廣播給其他視窗
                    myData.score += (1 / 60);
                    dropCounter++;
                    if(dropCounter % 1 === 0) moveDown(); // 每秒向下掉落
                    
                    syncToRoom(); 

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        startBtn.innerText = 'START';
                        startBtn.style.backgroundColor = 'var(--t-green)';
                        alert(`🎉 MISSION COMPLETE! 看看你蓋出的超長方塊！`);
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            startBtn.innerText = 'START';
            startBtn.style.backgroundColor = 'var(--t-green)';
            startBtn.style.color = '#fff';
            timeLeft = (parseInt(input.value) || 1) * 60;
            updateDisplay();
            board = Array.from({length: ROWS}, () => Array(COLS).fill(null)); // 重置盤面
        }

        function leaveRoom() {
            resetTimer();
            let bgm = document.getElementById('bgmAudio');
            if(!bgm.paused) toggleBGM();
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        /* -----------------------------------------------------------
           Canvas Tetris 引擎 (智慧 AI 版)
           ----------------------------------------------------------- */
        const canvas = document.getElementById('tetrisCanvas');
        const ctx = canvas.getContext('2d');
        const ROWS = 18, COLS = 10, BLOCK_SIZE = 20;
        let board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
        let currentPiece = null;

        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]], // Z
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]]  // L
        ];

        function rotate(matrix) { return matrix[0].map((val, index) => matrix.map(row => row[index]).reverse()); }

        // AI 評估盤面分數
        function evaluateBoard(testBoard) {
            let lines = 0, holes = 0, heightSum = 0, bumpiness = 0;
            let heights = new Array(COLS).fill(0);
            
            for (let r = 0; r < ROWS; r++) {
                if (testBoard[r].every(cell => cell !== null)) lines++;
            }
            
            for (let c = 0; c < COLS; c++) {
                let blockFound = false;
                for (let r = 0; r < ROWS; r++) {
                    if (testBoard[r][c] !== null) {
                        if (!blockFound) { heights[c] = ROWS - r; blockFound = true; }
                    } else if (blockFound) {
                        holes++;
                    }
                }
                heightSum += heights[c];
            }
            
            for (let c = 0; c < COLS - 1; c++) {
                bumpiness += Math.abs(heights[c] - heights[c + 1]);
            }
            // AI 權重：消除行(最高) - 高度 - 空洞 - 不平整
            return (lines * 20) - (heightSum * 0.5) - (holes * 4) - (bumpiness * 0.5);
        }

        // AI 窮舉計算最佳落點
        function calculateBestMove(rawShape, pieceColor) {
            let bestScore = -999999;
            let bestX = 0;
            let bestShape = rawShape;
            let currentTestShape = rawShape;
            
            for (let rot = 0; rot < 4; rot++) {
                for (let x = -2; x < COLS + 2; x++) {
                    if (!checkCollision(x, 0, currentTestShape, board)) {
                        let dropY = 0;
                        while (!checkCollision(x, dropY + 1, currentTestShape, board)) { dropY++; }
                        
                        let tempBoard = board.map(row => [...row]);
                        for (let r = 0; r < currentTestShape.length; r++) {
                            for (let c = 0; c < currentTestShape[r].length; c++) {
                                if (currentTestShape[r][c] && dropY + r >= 0) {
                                    tempBoard[dropY + r][x + c] = pieceColor;
                                }
                            }
                        }
                        
                        let score = evaluateBoard(tempBoard);
                        // 加入些微隨機性，避免 AI 行為過於僵化
                        score += Math.random() * 0.1; 
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestX = x;
                            bestShape = currentTestShape;
                        }
                    }
                }
                currentTestShape = rotate(currentTestShape);
            }
            return { shape: bestShape, x: bestX };
        }

        // 修改碰撞偵測以支援傳入測試用盤面
        function checkCollision(x, y, shape, testBoard = board) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        if (x + c < 0 || x + c >= COLS || y + r >= ROWS) return true;
                        if (y + r >= 0 && testBoard[y + r][x + c] !== null) return true;
                    }
                }
            }
            return false;
        }

        function spawnPiece() {
            let type = Math.floor(Math.random() * SHAPES.length);
            let rawShape = SHAPES[type];
            let pieceColor = COLORS[type];
            
            // 呼叫 AI 演算最佳落點
            let bestMove = calculateBestMove(rawShape, pieceColor);
            
            currentPiece = { 
                shape: bestMove.shape, 
                color: pieceColor, 
                x: bestMove.x, 
                y: 0 
            };
            
            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                board = Array.from({length: ROWS}, () => Array(COLS).fill(null)); // 滿了就重置
            }
        }

        function moveDown() {
            if (!currentPiece) return;
            if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
            } else {
                currentPiece.shape.forEach((row, r) => row.forEach((val, c) => {
                    if (val && currentPiece.y + r >= 0) board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                }));
                
                let linesCleared = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r].every(cell => cell !== null)) {
                        board.splice(r, 1);
                        board.unshift(Array(COLS).fill(null));
                        linesCleared++; r++;
                    }
                }
                // 消除行加分廣播
                if(linesCleared > 0) { myData.score += (linesCleared * 2); syncToRoom(); }
                
                currentPiece = null;
                spawnPiece();
            }
        }

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#222';
            for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) ctx.strokeRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            board.forEach((row, r) => row.forEach((color, c) => {
                if (color) { ctx.fillStyle = color; ctx.fillRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE); ctx.strokeStyle='#000'; ctx.strokeRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);}
            }));
            
            if (currentPiece) {
                currentPiece.shape.forEach((row, r) => row.forEach((val, c) => {
                    if (val) { ctx.fillStyle = currentPiece.color; ctx.fillRect((currentPiece.x+c)*BLOCK_SIZE, (currentPiece.y+r)*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE); ctx.strokeStyle='#000'; ctx.strokeRect((currentPiece.x+c)*BLOCK_SIZE, (currentPiece.y+r)*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);}
                }));
            }
            requestAnimationFrame(drawLoop);
        }
        drawLoop();
    </script>
</body>
</html>
